# atari7800-fujinet.cfg -- a FujiNet Atari 7800 client: 32K of ROM at $8000
# and the cart's 16K of RAM at $4000, which the claim at $FF70 asks for.
#
# Zero page is $40-$FF ($00-$3F are TIA and MARIA). The cart RAM holds DATA,
# BSS, the heap and, at its top, the C stack; VIDEO is page-aligned RAM for
# display lists and character maps, which MARIA reads by DMA. The console's
# own RAM at $1800 is CONSOLE. TILES is page-aligned ROM for MARIA graphics
# (CHARBASE). The crt0 (bus/atari7800/crt0.s) fills CLAIM and VECTORS;
# atari7800-romstamp.py checks them.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800;
}
MEMORY {
    ZP:      file = "", define = yes, start = $0040, size = $00C0, type = rw;
    CONSOLE: file = "", define = yes, start = $1800, size = $0840, type = rw;
    CRAM:    file = "", define = yes, start = $4000, size = $4000 - __STACKSIZE__, type = rw;
    STACK:   file = "", define = yes, start = $8000 - __STACKSIZE__, size = __STACKSIZE__, type = rw;
    ROM:     file = %O, define = yes, start = $8000, size = $7F70, type = ro, fill = yes, fillval = $FF;
    CLAIM:   file = %O, start = $FF70, size = $000A, type = ro, fill = yes, fillval = $00;
    SIG:     file = %O, start = $FF7A, size = $007E, type = ro, fill = yes, fillval = $FF;
    VEC:     file = %O, start = $FFF8, size = $0008, type = ro;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    EXTZP:    load = ZP,              type = zp,  optional = yes;
    TILES:    load = ROM,             type = ro,  optional = yes, align = $100, define = yes;
    STARTUP:  load = ROM,             type = ro,  define = yes;
    LOWCODE:  load = ROM,             type = ro,  optional = yes;
    ONCE:     load = ROM,             type = ro,  optional = yes;
    CODE:     load = ROM,             type = ro,  define = yes;
    RODATA:   load = ROM,             type = ro,  define = yes;
    VIDEO:    load = CRAM,            type = bss, optional = yes, align = $100, define = yes;
    DATA:     load = ROM, run = CRAM, type = rw,  define = yes;
    BSS:      load = CRAM,            type = bss, define = yes;
    CONSOLE:  load = CONSOLE,         type = bss, optional = yes, define = yes;
    CLAIM:    load = CLAIM,           type = ro;
    VECTORS:  load = VEC,             type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
