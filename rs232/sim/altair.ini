; SIMH AltairZ80: run a FujiNet example on a simulated 88-2SIO.
;   port A (10h/11h) = terminal: connect to TCP <term-port> (nc)
;   port B (12h/13h) = FujiNet: listens on TCP <fujinet-port>; bridge
;                      fujinet-pc's BoIP port with
;                        socat TCP:127.0.0.1:2301 TCP:127.0.0.1:1985
; usage: altairz80 altair.ini <program.bin> <term-port> <fujinet-port>
;   e.g.  altairz80 altair.ini netcat.bin 2300 2301
set cpu z80
set cpu 64k
; run the Z80 at 2 MHz (CLOCK is in kHz), so the software timeouts
; in ALTAIR.INC mean what they say
deposit clock 2000
set m2sio0 enabled
set m2sio1 enabled
set m2sio0 noconsole
; the 6850 drives RTS; let DTR follow it so TMXR answers the call
set m2sio0 dtr
set m2sio1 dtr
attach m2sio0 %2;notelnet
attach m2sio1 %3;notelnet
load %1 100
go 100
exit
